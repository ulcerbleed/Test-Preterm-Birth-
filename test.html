<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Преждевременные роды и перенашивание</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        .question-text {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .options label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .options label:hover {
            background: #eef2f5;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        .explanation {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            font-size: 0.95em;
        }
        .correct-answer {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .wrong-answer {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            display: none;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 20px;
            padding: 20px;
            background: #e8f4f8;
            border-radius: 8px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Тест: Преждевременные роды и перенашивание</h1>
    <p style="text-align: center; color: #666;">Выберите правильный вариант ответа. После выбора появится объяснение.</p>
    
    <div id="quiz-container">
        <!-- Вопросы будут сгенерированы через JS -->
    </div>

    <button id="submit-btn" onclick="showResults()">Показать результаты</button>
    <div id="result" class="result"></div>
</div>

<script>
    // Массив с вопросами, вариантами ответов, правильным ответом и объяснением
    const questions = [
        {
            question: "1. Какой срок беременности является критерием для постановки диагноза «Преждевременные роды»?",
            options: [
                "с 20 до 36 недель 6 дней",
                "с 22 до 37 недель",
                "с 28 до 38 недель"
            ],
            correct: 1,
            explanation: "Согласно клиническим рекомендациям, преждевременные роды — это роды, наступившие в сроке от 22 до 37 недель беременности (то есть до 36 недель 6 дней)."
        },
        {
            question: "2. Что такое перенашивание беременности?",
            options: [
                "Беременность, которая длится более 40 недель",
                "Беременность, которая длится 41-42 недели и более, с признаками перезрелости плода",
                "Беременность, которая длится более 42 недель без признаков страдания плода"
            ],
            correct: 1,
            explanation: "Перенашивание — это беременность, длящаяся 41-42 недели и более, характеризующаяся рождением плода с признаками перезрелости (Беллентайн-Руни) и/или признаками страдания плода."
        },
        {
            question: "3. Какая стадия клинической классификации ПР характеризуется наличием регулярной родовой деятельности и раскрытием шейки матки?",
            options: [
                "Угрожающие преждевременные роды",
                "Начавшиеся преждевременные роды",
                "Преждевременное излитие околоплодных вод"
            ],
            correct: 1,
            explanation: "Начавшиеся ПР характеризуются регулярной родовой деятельностью (схватками) и структурными изменениями шейки матки (сглаживание, раскрытие). Угрожающие — это только боли/тонус без схваток."
        },
        {
            question: "4. Какой препарат НЕ относится к токолитикам (средствам, снижающим тонус матки)?",
            options: [
                "Гексопреналин (Гинипрал)",
                "Нифедипин (Коринфар)",
                "Окситоцин"
            ],
            correct: 2,
            explanation: "Окситоцин — это утеротоник, он вызывает и усиливает схватки. Его используют для родовозбуждения, а не для остановки родов. Токолитики — это гинипрал, нифедипин, атозибан и др."
        },
        {
            question: "5. К какой категории недоношенных детей относятся новорождённые с массой тела от 1000 до 1499 граммов?",
            options: [
                "Очень низкая масса тела (ОНМТ)",
                "Экстремально низкая масса тела (ЭНМТ)",
                "Низкая масса тела (НМТ)"
            ],
            correct: 0,
            explanation: "1000–1499 г — это очень низкая масса тела (ОНМТ). Менее 1000 г — экстремально низкая (ЭНМТ), а 1500–2499 г — низкая (НМТ)."
        },
        {
            question: "6. Какое главное отличие переношенной беременности от пролонгированной?",
            options: [
                "Срок беременности (41 неделя и более)",
                "Наличие или отсутствие признаков перезрелости плода и плаценты",
                "Наличие или отсутствие схваток"
            ],
            correct: 1,
            explanation: "Главное отличие — в состоянии плода и плаценты. При пролонгированной беременности (истинный срок 41-42 нед) плод рождается зрелым, без признаков перезрелости. При переношенной — есть признаки перезрелости (петрификаты в плаценте, плотные кости черепа плода, сухая кожа)."
        },
        {
            question: "7. Какова тактика ведения при угрожающих преждевременных родах?",
            options: [
                "Немедленное родоразрешение путем кесарева сечения",
                "Токолиз, профилактика РДС плода глюкокортикоидами",
                "Стимуляция родовой деятельности окситоцином"
            ],
            correct: 1,
            explanation: "При угрожающих ПР главная цель — пролонгировать беременность. Для этого проводят токолиз (снятие тонуса матки) и вводят глюкокортикоиды (дексаметазон) для ускорения созревания легких плода (профилактика РДС)."
        },
        {
            question: "8. Что из перечисленного является наиболее значимым фактором риска преждевременных родов?",
            options: [
                "Возраст матери старше 30 лет",
                "Инфекции мочеполовой системы (ИППП, пиелонефрит)",
                "Занятия спортом во время беременности"
            ],
            correct: 1,
            explanation: "Инфекции мочеполового тракта (особенно урогенитальные инфекции) — один из ведущих факторов риска ПР. Они вызывают воспаление, которое провоцирует разрыв плодных оболочек и сокращение матки."
        }
    ];

    const quizContainer = document.getElementById('quiz-container');

    // Генерация вопросов
    questions.forEach((q, index) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.id = `q-block-${index}`;

        let optionsHtml = '';
        q.options.forEach((opt, optIndex) => {
            optionsHtml += `
                <label>
                    <input type="radio" name="q${index}" value="${optIndex}" onchange="checkAnswer(${index}, ${optIndex})">
                    ${opt}
                </label>
            `;
        });

        block.innerHTML = `
            <div class="question-text">${q.question}</div>
            <div class="options">${optionsHtml}</div>
            <div class="explanation" id="exp-${index}">
                <strong>Объяснение:</strong> ${q.explanation}
            </div>
        `;
        quizContainer.appendChild(block);
    });

    // Функция проверки ответа при клике
    function checkAnswer(qIndex, selectedOption) {
        const expDiv = document.getElementById(`exp-${qIndex}`);
        const block = document.getElementById(`q-block-${qIndex}`);
        const inputs = block.querySelectorAll('input[type="radio"]');
        
        // Блокируем изменение ответа после выбора
        inputs.forEach(input => input.disabled = true);

        // Показываем объяснение
        expDiv.style.display = 'block';

        // Проверяем правильность
        if (selectedOption === questions[qIndex].correct) {
            expDiv.classList.add('correct-answer');
            expDiv.innerHTML = `<strong>✅ Верно!</strong><br>${questions[qIndex].explanation}`;
        } else {
            expDiv.classList.add('wrong-answer');
            const correctText = questions[qIndex].options[questions[qIndex].correct];
            expDiv.innerHTML = `<strong>❌ Неверно.</strong> Правильный ответ: <em>${correctText}</em>.<br><br>${questions[qIndex].explanation}`;
        }
    }

    // Функция подсчета результатов (опционально)
    function showResults() {
        let score = 0;
        let answered = 0;

        questions.forEach((q, index) => {
            const inputs = document.getElementsByName(`q${index}`);
            for (let input of inputs) {
                if (input.checked) {
                    answered++;
                    if (parseInt(input.value) === q.correct) {
                        score++;
                    }
                }
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (answered === 0) {
            resultDiv.innerHTML = "Вы пока не ответили ни на один вопрос.";
            return;
        }

        const percent = Math.round((score / questions.length) * 100);
        let message = "";
        if (percent === 100) message = "Идеально! Вы отлично знаете тему.";
        else if (percent >= 80) message = "Отличный результат! Почти всё верно.";
        else if (percent >= 50) message = "Хорошо, но есть над чем поработать.";
        else message = "Стоит еще раз повторить материал.";

        resultDiv.innerHTML = `
            Вы ответили правильно на <strong>${score}</strong> из <strong>${questions.length}</strong> вопросов (${percent}%).<br>
            ${message}
        `;
    }
</script>

</body>
</html>
